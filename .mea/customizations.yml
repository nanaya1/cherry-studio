version: 1
product: MEACowork
policy:
  baseline_branch: meacowork
  upstream_branch: upstream/main
  merge_strategy: semantic-three-way
  marker_format: "MEA:<customization-id>"
  require_tests: true
  preserve_original_code_by_comment: true
customizations:
  - id: remote-knowledge-upgrade-repair
    title: 旧发布线升级补齐远程知识库表
    owner: main
    behavior: 旧库迁移时间戳越过0031时，追加迁移幂等补建助手绑定、智能体绑定及远程知识服务表；保留已有业务数据与已存在的绑定，不改写历史迁移记录。
    markers:
      - MEA:remote-knowledge-upgrade-repair
    touchpoints:
      - migrations/sqlite-drizzle/0034_remote_knowledge_upgrade_repair.sql
      - migrations/sqlite-drizzle/meta/_journal.json
    tests:
      - src/main/data/db/__tests__/applyMigrations.test.ts
  - id: enterprise-knowledge-page
    # title: 企业知识库访问、原文预览、本地分享、列表菜单取消分享与手动同步
    # title: 企业知识库访问、原文预览、本地分享保留多层目录、列表菜单取消分享与手动同步
    title: 企业知识库云端管理、托管新增资料与取消恢复本地
    # 首次分享按groupId创建父子目录并传parent_id，含已导入空目录；目录写前intent及可信ID持久化，未知结果禁止重建。
    # 核对远端名称/空间/父目录/is_dir后才完成；历史已完成平铺副本不自动迁移。回归覆盖FirstShareUpload和OrgKnowledgeFirstShare。
    # 原件上传默认开启，两个分享入口透传uploadOriginal；核对按文件恢复持久模式，缺省true。
    # 首次模式库级写前持久化并携带allow_local_file_upload创建；恢复隐藏选择，追加实时读取策略，未知拒绝上传。
    # 原件入口严格按每文件has_original_file展示；直接预览复核能力，策略与下载权限独立透传。
    # 关闭原件仍核对可信身份、目录和一对一完整分块；首次计划仍读取本机原件hash作为副本身份。
    # P1：知识库DELETE凭据获取前后校验原租约/session身份且不401重放；恢复先固化expectedHashes再核对导入目标。
    # 删除模式不扫描/下载/恢复：先固化当前账号可信副本，DELETE成功后才清受管本机库、分组及失效引用；未知禁止重发，失败仅本机续作。
    # 三分类：local聚合本机与catalog.owned，localBaseId关联去重且点击云端详情；public/shared严格使用各自目录，跨端owned可管理。
    # 列表附加FileOut的403/404/422/常见5xx及协议错误仅使该文件能力未知；列表授权、401、租约和未知异常仍阻断。
    # 目录分页拒绝重复游标并显示错误；返回上级、切库和卸载后丢弃迟到响应。
    # 切库同步本机路由与云端选中，详情独立会话清理预览/目录/页码；旧refresh和取消分享回调不能覆盖新库。
    # 主进程列表校验全部条目base_id匹配请求库，跨库响应按协议错误阻断而非静默展示。
    # 首次分享失败改为task可信空间补偿：先持久cleanup再停止流，owner/lease校验DELETE，unknown不重放；保留本机资料，追加及completed不回滚。
    owner: main
    behavior: 文档标识经显式文件映射或文件元信息校验后用于预览；主进程鉴权限量读取，渲染进程以纯文本、图片或沙箱 PDF 展示。首次分享递归stat原文件总量（含子目录），逐文件流式上传；2026-10-17最新约定暂不设置客户端总容量上限，取代此前2GiB及临时20MiB限制，OrgKnowledgeService.buildFirstSharePlan及FirstShareUpload.run两处旧检查和抛错均保留为注释，服务端仍可限制容量且错误处理保持不变；客户端原子互斥且同库复用，列表可重开字节进度详情。创建及文件请求前持久化intent，响应归属和分块数校验后保存fileId并核对哈希和完整分块，未知结果暂停且不得盲目重传或重建库；Cookie流式请求不手设Content-Length，传输结束关闭源流；上传连续5分钟无字节进展或服务器响应时中止并清理源流，创建库和远端核对请求30秒超时，未知结果不重放且finally释放全局忙碌槽；全部确认前禁止分享码和邀请。分享码与人员邀请弹窗重开时隐藏历史completed进度、上传说明及复用文件成功结果，本会话新上传或未完成恢复仍展示进度与完成反馈，不清理持久化记录。后续旧manifest推送已停用；本机任务不得自动写云端，云端owner新增文件先托管解析再上传到同space并保留可信fileId。分享完成迁移助手与智能体知识源，取消时先恢复可用本地资料，下载故障阻断删除；缺失资料与其他设备停止操作须明确确认，未知DELETE持久化且不重发，可信删除后回绑本地。
    markers:
      - MEA:enterprise-knowledge-page
