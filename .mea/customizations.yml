  - id: personal-space-diagnostics
    title: Diagnose the current MEA account space and export local diagnostics
    owner: main
    behavior: General checks allow guest use. Managed Xuelang checks distinguish rejected credentials, service unavailability, and model synchronization outcomes. Diagnostics never start a model synchronization. Data-directory fallback compares the configured and resolved base paths. Diagnostic IPC offers only active-space logs and disables Cherry report submission.
