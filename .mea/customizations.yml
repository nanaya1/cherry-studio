  - id: profile-online-login
    title: Require online management identity before profile business startup
    owner: main
    # behavior: In profile isolation mode, local records are legacy staging only. Verify authenticated candidates online against modern currentuser before starting business services; route failed verification to recovery and persist signed-out selection before login.
    # behavior: In profile isolation mode, local records are legacy staging only. Verify authenticated candidates online before business startup; persist signed-out selection before login. Keep one bootstrap window, reuse only identical complete launch contexts, defer display until ready even on second-instance, and close with a localized prompt on main-frame load failure. Replaced windows cannot remove current IPC handlers or consume OAuth callbacks; preserve login cancellation exit, successful activation and relaunch semantics.
    # behavior: Require online verification before business startup; retain the candidate and credentials with an isolated real retry when verification is unavailable, and select signed-out only on explicit user action. Keep one owner-checked bootstrap window and reveal only after readiness. User logout alone starts teardown; keep the process alive through login ready-to-show. Superseded windows cannot consume callbacks or terminate the current window; unrecoverable handoff failures require a visible restart-or-quit choice.
    behavior: 业务启动必须通过在线身份验证；验证成功直接进入主界面，失败先完成现有 signed-out 切换事务再打开原账号密码登录窗口，不新增页面或窗口，不清理候选凭据和业务数据。独立 startup recovery 的窗口入口、IPC 注册和 preload 桥接均停用；business 候选不可直接创建 bootstrap 窗口。保留窗口所有者检查、首帧显示、退出登录交接及异常事务恢复边界；替换后的旧窗口不能消费回调或终止当前窗口。
    markers:
      - MEA:profile-online-login
    touchpoints:
      - src/main/main.ts
      - src/main/core/preboot/profileIsolationRuntime.ts
      - src/main/core/profiles/ProfileStartupVerifier.ts
      - src/main/core/profiles/ProfilePrebootCoordinator.ts
      - src/main/core/profiles/ProfileSessionService.ts
      - src/main/core/profiles/ProfileControlStore.ts
      # - src/main/core/profiles/ProfileRecoveryActions.ts
      - src/main/core/profiles/ProfileBootstrapWindow.ts
      - src/main/core/profiles/ProfileBootstrapWindow.ts
