  - id: profile-verification-network-tolerance
    title: 弱网保留进程内授权且后台不自动退出
    owner: main
    # 原契约保留；冷启动失败现统一进入登录，不再要求先在启动恢复窗口点击切换账号。
    # behavior: In-process verified accounts retain business access during network or uncertain verification failures without a time-based revocation. Only structured definitive evidence blocks execution; background verification and refresh never log out or tear down services. Publish owner-versioned status for a non-dismissible main-window dialog, keep cancellation and recovery available, and require explicit user action to switch accounts. Authentication HTTP semantics remain a release-validation prerequisite when no authoritative server contract is available.
    behavior: 冷启动在线验证成功直接启动业务；任何验证失败均复用 selectSignedOutForStartup 的现有协调事务，持久选择隔离 signed-out 空间并打开现有密码登录页，不再打开启动验证恢复窗口，停用其窗口参数、startup=1 加载路径、IPC 注册和 preload 桥接。仅切换活动指针，不执行 logout、不清空或隔离候选凭据、不删除业务数据；保留 legacyRoot。登录仍经过现有受信任 IPC、在线认证与账号切换校验；事务失败保持业务关闭并沿用控制状态恢复。已在线验证的进程内账号仍在网络或不确定失败时保留业务授权，仅结构化确定失效证据阻断执行；后台验证和刷新不自动退出或销毁服务。同进程激活的 throw 失败策略保留，避免在已提交切换事务中嵌套 signed-out 事务。无权威服务端契约时，HTTP 认证语义仍需发布验证。
    markers:
      - MEA:profile-verification-network-tolerance
      - MEA:profile-online-login
