  - id: personal-profile-startup
    title: Load the selected personal data space before startup
    owner: preboot
    behavior: Lock and relocate the app data root before selecting a profile. Guests use the base data root. Accounts isolate Electron and Chromium data. Reset preserves the selected login and targets the current space. Backup exports target the current space, automatic destinations are namespaced, and restore confirmation shows the source and destination. Logs and integration data are scoped to the active space, with legacy integration data reserved for guests.
