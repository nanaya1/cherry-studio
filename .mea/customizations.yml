version: 1
product: MEACowork
policy:
  baseline_branch: meacowork
  upstream_branch: upstream/main
  merge_strategy: semantic-three-way
  marker_format: "MEA:<customization-id>"
  require_tests: true
  preserve_original_code_by_comment: true
customizations:
  - id: api-gateway-listener-isolation
    title: 对外网关与 Agent 内部网关独立
    owner: main
    behavior: 关闭对外网关时保留 MEA 的 24333 配置，Agent 仍可按需启动仅本机可访问的内部网关，内部调用不改变对外开关与配置。
    touchpoints:
      - src/shared/utils/apiGateway.ts
      - src/main/features/apiGateway/ApiGatewayService.ts
      - src/main/ai/runtime/agentApiGateway.ts
      - src/main/ai/runtime/claudeCode/agentSessionWarmup.ts
    tests:
      - src/main/features/apiGateway/__tests__/ApiGatewayService.test.ts
      - src/main/ai/runtime/__tests__/agentApiGateway.test.ts
      - src/main/ai/runtime/claudeCode/__tests__/agentSessionWarmup.test.ts

  - id: dsh-plan-permission-confirmation
    title: 旧 DSH 计划模式迁移后的权限确认
    owner: main
    behavior: 旧 DSH 计划模式迁移到 Pi 后保留历史，首次发送前确认默认权限。确认前阻止交互执行和后台任务，保留 MEA 内置工具禁用规则。
    markers:
      - MEA:dsh-plan-permission-confirmation
    touchpoints:
      - src/main/data/services/retiredAgentRuntimeMigration.ts
      - src/main/ai/streamManager/context/AgentChatContextProvider.ts
      - src/main/ai/agents/runAgentTask.ts
      - src/main/ai/runtime/pi/PiRuntimeConnection.ts
      - src/renderer/components/composer/variants/AgentComposer.tsx
      - src/shared/data/api/schemas/agents.ts
    tests:
      - src/main/ai/runtime/pi/__tests__/retiredSessionHistory.test.ts
      - src/main/ai/streamManager/context/__tests__/AgentChatContextProvider.test.ts

  - id: legacy-feedback-history
    title: 保留旧版反馈会话
    owner: main
    behavior: 旧产品反馈智能体退出常用列表和全局搜索。升级保留智能体和关联历史，已有关联会话仍可按原 ID 打开。
    touchpoints:
      - src/main/data/db/seeding/seederRegistry.ts
      - src/main/data/services/AgentService.ts
    tests:
      - src/main/data/db/seeding/__tests__/cherrySupportSeeder.test.ts

  - id: mea-published-upgrade
    title: MEA 正式版数据库覆盖升级
    owner: main
    behavior: MEA 最早正式版为 2.0.11。启动直接使用现有 MEA 数据目录和数据库升级链，无需运行 Cherry Studio 旧版桥接安装流程。
    touchpoints:
      - src/main/main.ts
      - src/main/core/preboot/userDataLocation.ts
      - src/main/data/db/applyMigrations.ts
      - migrations/sqlite-drizzle/0034_upstream_v2_2_3.sql
    tests:
      - src/main/data/db/__tests__/applyMigrations.test.ts
      - src/main/data/db/__tests__/applyMigrations.populated.test.ts

  - id: dingtalk-legacy-channels
    title: 保留旧钉钉频道的会话兼容
    owner: main
    behavior: 升级标记已有钉钉频道，保留原始会话 ID、机器人码回退和群聊提及设置。已有频道使用兼容适配器和表单，新建频道默认进入新版钉钉流程。
    markers:
      - MEA:dingtalk-legacy-channels
    touchpoints:
      - migrations/sqlite-drizzle/0034_upstream_v2_2_3.sql
      - src/main/ai/channels/channelAdapterLoader.ts
      - src/main/ai/channels/adapters/dingtalk/LegacyDingTalkAdapter.ts
      - src/shared/data/types/channel.ts
      - src/shared/data/api/schemas/agentChannels.ts
      - src/renderer/pages/settings/ChannelsSettings/ChannelForms.tsx
    tests:
      - src/main/data/db/__tests__/applyMigrations.test.ts
      - src/main/ai/channels/adapters/__tests__/LegacyDingTalkAdapter.test.ts
      - src/main/ai/channels/adapters/__tests__/DingTalkAdapter.test.ts

  - id: scheduled-task-notification-route
    title: 保留计划任务页面并从通知打开运行结果
    owner: renderer
    behavior: 侧栏和常规任务详情沿用 MEA 页面。完成通知打开 2.2.3 结果页，并使用通知对应的运行 ID 定位结果。
    markers:
      - MEA:scheduled-task-notification-route
    touchpoints:
      - src/main/ai/agents/agentTaskNotification.ts
      - src/main/services/notificationActivation.ts
      - src/shared/data/types/notification.ts
      - src/renderer/routes/app/scheduled-tasks.tsx
      - src/renderer/routes/app/scheduled-tasks.index.tsx
      - src/renderer/pages/agents/ScheduledTasksPage.tsx
      - src/renderer/pages/settings/TasksSettings.tsx
    tests:
      - src/renderer/routes/settings/__tests__/scheduled-tasks.test.ts
      - src/renderer/pages/agents/__tests__/ScheduledTasksPage.endStates.test.tsx

  - id: xuelang-oauth-model-sync
    title: 雪浪授权后自动补齐账号可用模型
    owner: renderer
    behavior: 雪浪授权或重新领取凭据成功后，用已落库密钥拉取账号可用模型，按最新本地模型身份仅新增缺失项；不覆盖自定义设置、不重启用已禁用模型、不删除旧模型。同步失败单独提示且不影响登录；取消或过期后不开始下一次模型写入。CherryIN 和其他同步入口保持原行为。
    markers:
      - MEA:xuelang-oauth-model-sync
    touchpoints:
      - src/renderer/pages/settings/ProviderSettings/ProviderSpecific/CherryInOauth.tsx
      - src/renderer/pages/settings/ProviderSettings/hooks/useProviderModelSync.ts
    tests:
      - src/renderer/pages/settings/ProviderSettings/__tests__/CherryInOauth.test.tsx
      - src/renderer/pages/settings/ProviderSettings/hooks/__tests__/useProviderModelSync.test.tsx

  - id: remote-knowledge-schema-repair
    title: 远程知识库历史数据库结构修复
    owner: main
    behavior: 启动迁移后幂等补齐 0031_busy_spot 创建的远程知识库服务及 Agent/Assistant 绑定表，使迁移游标已越过 0031 但实际缺表的历史数据库可无损恢复；不得修改已发布的 0031 迁移。
    markers:
      - MEA:remote-knowledge-schema-repair
    touchpoints:
      - src/main/data/db/applyMigrations.ts
    tests:
      - src/main/data/db/__tests__/applyMigrations.test.ts

  - id: product-identity
    title: MEA application identity and protocol
    owner: main
    # behavior: Keep MEACowork productName, com.meacowork.desktop appId, meacowork:// protocol, API gateway port 24333, and OpenClaw port 19790.
    behavior: Keep MEACowork productName, com.meacowork.desktop appId, meacowork:// protocol, API gateway port 24333, and OpenClaw port 19790. Preserve the blue-green brand icon across application packages, UI logos, default avatar, and tray icons; macOS tray artwork must retain a transparent monochrome mask. Display MEA Cowork in localized UI, window titles, bundled release notes, and legacy provider branding while preserving compatibility identifiers.
    touchpoints:
      - build/icon.png
      - build/icon.ico
      - build/icon.icns
      - build/icons
      - build/logo.png
      - build/tray_icon.png
      - build/tray_icon_dark.png
      - build/tray_icon_light.png
      - src/renderer/assets/images/logo.png
      - src/renderer/assets/images/avatar.svg
      - src/renderer/i18n/locales
      - src/main/i18n/locales
      - src/renderer/windows/selection/agent/index.html
      - src/renderer/windows/selection/capsule/index.html
      - src/renderer/utils/naming.ts
      - packages/ui/icons/providers/light/cherryin.svg
      - packages/ui/src/components/icons/providers/cherryin
      - resources/cherry-studio/release-history.json
      - package.json
      - electron-builder.yml
      - src/main/services/protocol/ProtocolService.ts
      - src/main/services/OpenClawService.ts
      - src/shared/data/preference/preferenceSchemas.ts
    tests:
      - src/main/services/protocol/__tests__/ProtocolService.test.ts
      - src/renderer/utils/__tests__/naming.test.ts
      - src/main/services/__tests__/OpenClawService.test.ts
      - src/main/features/apiGateway/routes/__tests__/routes.integration.test.ts

  - id: enterprise-login
    title: 企业 OAuth 登录生命周期与等待恢复
    owner: main
    # behavior: 企业登录保持单一 PKCE attempt，重复 start 不重开浏览器；10 分钟绝对截止时间和 token exchange 的独立 30 秒超时覆盖休眠及响应体阻塞。取消只接受当前 attempt，旧回调、浏览器失败及 refresh 不得覆盖新尝试或复活已退出会话。UI 禁止重复登录、支持取消、等待提示和错误恢复；start 后查询权威状态，cancel true/false 均校准会话，广播丢失时按主进程开始时间在 deadline 单次查询，迟到查询不得覆盖新事件；登出不影响已复制资源。
    behavior: 企业登录保持单一 PKCE attempt，重复 start 不重开浏览器；10 分钟绝对截止时间和 token exchange 的独立 30 秒超时覆盖休眠及响应体阻塞。取消只接受当前 attempt，旧回调、浏览器失败及 refresh 不得覆盖新尝试或复活已退出会话。UI 禁止重复登录、支持取消、等待提示和错误恢复；start 后查询权威状态，cancel true/false 均校准会话，广播丢失时按主进程开始时间在 deadline 单次查询，迟到查询不得覆盖新事件；登出不影响已复制资源。弹窗关闭清除局部错误，初开、重开及卸载重建不回放历史 timeout/failed/denied；当前窗口新事件及本次 start/cancel 结果仍反馈，关闭不取消授权，重开按真实状态恢复 60 秒等待提示。
    markers:
      - MEA:enterprise-login
    touchpoints:
      - src/main/enterprise/OrgAuthManager.ts
      - src/main/enterprise/types.ts
      - src/main/ipc/handlers/enterprise.ts
      - src/shared/ipc/schemas/enterprise.ts
      - src/renderer/hooks/useOrgAccountSession.ts
      - src/renderer/components/UserPopup.tsx
      - src/renderer/i18n/locales
    tests:
      - src/main/enterprise/__tests__/OrgAuthManager.test.ts
      - src/main/enterprise/__tests__/OrgAuthCallback.test.ts
      - src/main/ipc/handlers/__tests__/enterprise.test.ts
      - src/renderer/hooks/__tests__/useOrgAccountSession.test.ts
      - src/renderer/components/__tests__/UserPopup.test.tsx

  - id: oauth-branding
    title: MEA OAuth callback and repository identity
    owner: main
    behavior: Keep the meacowork:// OAuth callback and DCR client_uri pointing to https://github.com/nanaya1/cherry-studio.
    touchpoints:
      - src/main/services/oauth/CherryInOAuthConfig.ts
      - src/main/ai/mcp/oauth/provider.ts
      - src/main/services/MainWindowService.ts
    tests:
      - src/main/services/oauth/__tests__/GatewayOAuthConfigs.test.ts
      - src/main/services/oauth/runtime/__tests__/DeepLinkCallbackTransport.test.ts

  - id: xuelang-oauth-lifecycle
    title: 雪浪工匠授权取消与全程超时恢复
    owner: main
    behavior: 雪浪 deep-link attempt 按窗口和 requestId 隔离，允许随时取消；60 秒显示等待提醒，10 分钟 watchdog 覆盖 start IPC、浏览器打开和异步保存。取消或过期后迟到交换不得开始写入，persist await 前后及后续副作用检查 attempt；同 provider 新尝试不受旧结果影响。已提交写入不承诺回滚，卸载不主动取消但使旧组件保存失效；保持 CherryIN 与协议入口不变。审查补齐 CherryIN 既有的服务器上下文匹配及 preset 派生识别契约。
    markers:
      - MEA:xuelang-oauth-lifecycle
    touchpoints:
      - src/main/services/oauth/runtime/OAuthRuntimeService.ts
      - src/main/services/oauth/runtime/DeepLinkCallbackTransport.ts
      - src/main/services/oauth/runtime/types.ts
      - src/main/ipc/handlers/oauth.ts
      - src/shared/ipc/schemas/oauth.ts
      - src/renderer/services/oauth.ts
      - src/renderer/pages/settings/ProviderSettings/ProviderSpecific/CherryInOauth.tsx
    tests:
      - src/main/services/oauth/runtime/__tests__/OAuthRuntimeService.integration.test.ts
      - src/renderer/services/__tests__/oauth.test.ts
      - src/renderer/pages/settings/ProviderSettings/__tests__/CherryInOauth.test.tsx

