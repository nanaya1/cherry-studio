  - id: hidden-settings
    title: Hide legacy MCP and Skills settings everywhere
    owner: renderer
    behavior: Hide /settings/mcp and /settings/skills from every consumer, including navigation and settings search; all consumers must share MEA_HIDDEN_SETTINGS_ROUTES.
